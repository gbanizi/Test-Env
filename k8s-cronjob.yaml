apiVersion: batch/v1
kind: CronJob
metadata:
  name: fintech-monitor-cron
  labels:
    app: fraud-detection
    team: devops-leeds
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: fintech-monitor
            image: fintech-monitor:v1
            imagePullPolicy: Never
            command: ["/bin/bash"]
            args: ["-c", "./monitor.sh && cat alerts.log && echo '---K8S CHECK DONE---'"]
          restartPolicy: OnFailure

